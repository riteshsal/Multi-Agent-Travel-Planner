name: Keep Render App Awake

on:
  schedule:
    # Runs every 10 minutes. Render sleeps after 15 minutes of no traffic,
    # so this stays comfortably under that limit.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    # Lets you trigger it manually from the Actions tab to test it.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          echo "Pinging app to keep it awake..."
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" "$APP_URL" --max-time 90
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
